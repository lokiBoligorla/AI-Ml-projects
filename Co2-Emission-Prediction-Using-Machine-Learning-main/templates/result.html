<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EcoPulse | Emission Prediction Result</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-gradient: linear-gradient(135deg, #06100c 0%, #0d1e17 50%, #05140e 100%);
            --card-bg: rgba(18, 38, 32, 0.45);
            --card-border: rgba(46, 213, 115, 0.15);
            --text-primary: #f3f9f6;
            --text-secondary: #a3c2b6;
            --primary: #2ed573;
            --primary-glow: rgba(46, 213, 115, 0.35);
            --accent: #10ac84;
            --font-display: 'Outfit', sans-serif;
            --font-body: 'Plus Jakarta Sans', sans-serif;
            
            /* Emission severity levels colors */
            --color-low: #2ed573;
            --color-medium: #ffa502;
            --color-high: #ff4757;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: var(--font-body);
            background: var(--bg-gradient);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            overflow-x: hidden;
            position: relative;
            padding: 2rem 1rem;
        }

        /* Decorative background blobs */
        .blob {
            position: absolute;
            width: 450px;
            height: 450px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(46, 213, 115, 0.06) 0%, rgba(16, 172, 132, 0) 70%);
            filter: blur(50px);
            z-index: 0;
            pointer-events: none;
            animation: float 25s infinite alternate ease-in-out;
        }

        .blob-1 {
            top: -15%;
            right: -10%;
            animation-delay: -2s;
        }

        .blob-2 {
            bottom: -15%;
            left: -10%;
            animation-delay: -8s;
        }

        @keyframes float {
            0% { transform: translate(0, 0) scale(1); }
            50% { transform: translate(-40px, 60px) scale(1.05); }
            100% { transform: translate(30px, -30px) scale(0.95); }
        }

        .container {
            width: 100%;
            max-width: 580px;
            z-index: 1;
            position: relative;
            animation: slideUp 0.8s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Glassmorphic Panel */
        .panel {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 28px;
            padding: 3rem 2.5rem;
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.35), 
                        inset 0 1px 0 rgba(255, 255, 255, 0.05);
            text-align: center;
        }

        .success-badge {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 56px;
            height: 56px;
            border-radius: 50%;
            background: rgba(46, 213, 115, 0.12);
            color: var(--primary);
            margin-bottom: 1.5rem;
            border: 1.5px solid rgba(46, 213, 115, 0.25);
            box-shadow: 0 0 20px rgba(46, 213, 115, 0.1);
        }

        h1 {
            font-family: var(--font-display);
            font-size: 2rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
            color: #ffffff;
        }

        .label-text {
            color: var(--text-secondary);
            font-size: 0.95rem;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            font-weight: 600;
            margin-bottom: 1.5rem;
        }

        /* Large Emission Value Display */
        .emission-display {
            position: relative;
            display: inline-block;
            margin: 1.5rem 0;
            padding: 1.5rem 3rem;
            border-radius: 20px;
            background: rgba(0, 0, 0, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .emission-number {
            font-family: var(--font-display);
            font-size: 4.5rem;
            font-weight: 800;
            line-height: 1;
            letter-spacing: -2px;
            background: linear-gradient(135deg, #ffffff 40%, var(--primary) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            display: block;
        }

        .emission-unit {
            font-size: 1.1rem;
            color: var(--text-secondary);
            font-weight: 600;
            margin-top: 0.4rem;
            display: block;
            letter-spacing: 0.5px;
        }

        /* Visual Rating / Severity Badge */
        .rating-badge {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.5rem 1.2rem;
            border-radius: 100px;
            font-family: var(--font-display);
            font-size: 0.9rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 2rem;
        }

        /* Offset comparison */
        .comparison-box {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 18px;
            padding: 1.5rem;
            margin-bottom: 2.5rem;
            text-align: left;
            position: relative;
            overflow: hidden;
        }

        .comparison-title {
            font-family: var(--font-display);
            font-size: 1rem;
            font-weight: 600;
            margin-bottom: 0.5rem;
            color: #ffffff;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .comparison-title svg {
            color: var(--primary);
        }

        .comparison-desc {
            font-size: 0.88rem;
            color: var(--text-secondary);
            line-height: 1.5;
        }

        .highlight {
            color: #ffffff;
            font-weight: 700;
        }

        /* Button back */
        .btn-back {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.6rem;
            width: 100%;
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 14px;
            padding: 1.1rem;
            color: #ffffff;
            font-family: var(--font-display);
            font-size: 1.05rem;
            font-weight: 700;
            text-decoration: none;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.165, 0.84, 0.44, 1);
        }

        .btn-back:hover {
            background: rgba(255, 255, 255, 0.12);
            border-color: rgba(46, 213, 115, 0.3);
            transform: translateY(-2px);
        }

        .btn-back:active {
            transform: translateY(0);
        }

        footer {
            margin-top: 3rem;
            text-align: center;
            font-size: 0.8rem;
            color: var(--text-secondary);
            z-index: 1;
        }

        footer a {
            color: var(--primary);
            text-decoration: none;
            font-weight: 600;
        }

        footer a:hover {
            color: #ffffff;
            text-decoration: underline;
        }

        /* Class adjustments dynamically injected */
        .rating-low {
            background: rgba(46, 213, 115, 0.1);
            color: var(--color-low);
            border: 1px solid rgba(46, 213, 115, 0.2);
        }
        .rating-medium {
            background: rgba(255, 165, 2, 0.1);
            color: var(--color-medium);
            border: 1px solid rgba(255, 165, 2, 0.2);
        }
        .rating-high {
            background: rgba(255, 71, 87, 0.1);
            color: var(--color-high);
            border: 1px solid rgba(255, 71, 87, 0.2);
        }

        @media (max-width: 480px) {
            .panel {
                padding: 2rem 1.5rem;
            }
            .emission-number {
                font-size: 3.5rem;
            }
        }
    </style>
</head>
<body>
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>

    <div class="container">
        <div class="panel">
            <!-- Icon -->
            <div class="success-badge">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path><polyline points="22 4 12 14.01 9 11.01"></polyline></svg>
            </div>

            <h1>Analysis Complete</h1>
            <p class="label-text">Tailpipe Emission Prediction</p>

            <!-- Emission Value Display -->
            <div class="emission-display">
                <span class="emission-number">{{ EMI }}</span>
                <span class="emission-unit">g/km CO₂ emissions</span>
            </div>

            <br>

            <!-- Dynamic Rating Badge -->
            <script>
                // We run client-side script to color-code based on the server-rendered EMI value
                document.addEventListener("DOMContentLoaded", () => {
                    const emiVal = parseInt("{{ EMI }}", 10);
                    const badge = document.getElementById("ratingBadge");
                    const icon = document.getElementById("ratingIcon");
                    const label = document.getElementById("ratingLabel");
                    const textCompare = document.getElementById("textCompare");
                    
                    // Normal targets: Low < 200, Med 200-300, High > 300 g/km
                    if (emiVal < 200) {
                        badge.className = "rating-badge rating-low";
                        label.innerText = "Low Impact";
                        icon.innerHTML = '<path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path><polyline points="22 4 12 14.01 9 11.01"></polyline>';
                        textCompare.innerHTML = `Your vehicle is highly efficient. To offset its yearly emissions (driving 15,000 km), it takes approximately <span class="highlight">${Math.ceil(emiVal * 15 / 10)} trees</span> to be planted and grown for 10 years.`;
                    } else if (emiVal <= 300) {
                        badge.className = "rating-badge rating-medium";
                        label.innerText = "Moderate Impact";
                        icon.innerHTML = '<circle cx="12" cy="12" r="10"></circle><line x1="12" y1="8" x2="12" y2="12"></line><line x1="12" y1="16" x2="12.01" y2="16"></line>';
                        textCompare.innerHTML = `This carbon footprint is average for medium-sized cars. Offsetting its annual emissions (driving 15,000 km) requires planting about <span class="highlight">${Math.ceil(emiVal * 15 / 10)} trees</span>.`;
                    } else {
                        badge.className = "rating-badge rating-high";
                        label.innerText = "High Impact";
                        icon.innerHTML = '<polygon points="7.86 2 16.14 2 22 7.86 22 16.14 16.14 22 7.86 22 2 16.14 2 7.86 7.86 2"></polygon><line x1="12" y1="8" x2="12" y2="12"></line><line x1="12" y1="16" x2="12.01" y2="16"></line>';
                        textCompare.innerHTML = `High environmental impact typical of large displacement/SUV engines. Offsetting its yearly footprint requires planting over <span class="highlight">${Math.ceil(emiVal * 15 / 10)} trees</span>. Consider carpooling or eco-driving techniques!`;
                    }
                });
            </script>
            <div class="rating-badge rating-low" id="ratingBadge">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" id="ratingIcon">
                    <!-- Dynamic icon -->
                </svg>
                <span id="ratingLabel">Low Impact</span>
            </div>

            <!-- Contextual Comparison Box -->
            <div class="comparison-box">
                <div class="comparison-title">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"></path></svg>
                    <span>Environmental Context</span>
                </div>
                <p class="comparison-desc" id="textCompare">
                    Loading carbon offset context...
                </p>
            </div>

            <!-- Predict Again Button -->
            <a href="/" class="btn-back">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
                <span>Calculate Another Vehicle</span>
            </a>
        </div>

        <!-- Footer -->
        <footer>
            <p>EcoPulse AI &bull; Linear Regression Model</p>
        </footer>
    </div>
</body>
</html>
